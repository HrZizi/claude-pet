name: Release

# Push a tag like v0.1.0 to build the Windows installer + portable zip and the macOS app,
# and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/build.py
      - name: Smoke-test the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "ClaudePet"
          $setup = (Get-ChildItem dist/ClaudePet-Setup-*.exe).FullName
          Start-Process $setup -ArgumentList "--silent","--dir",$d,"--no-connect","--no-launch" -Wait
          & "$d\claude-pet-cli.exe" --version
          & "$d\claude-pet-cli.exe" doctor
          Start-Process "$d\ClaudePet-Uninstall.exe" -ArgumentList "--uninstall","--silent","--keep-hooks" -Wait
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClaudePet-Setup-*.exe
            dist/ClaudePet-*-windows-portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,mac]"
      - run: python scripts/build.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudePet-*-macos.zip
