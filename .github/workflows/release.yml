name: Release

# Push a tag like v0.1.1 to build the Windows installer + portable zip and the macOS app,
# and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/build.py
      - name: Smoke-test the artifacts (portable zip + silent install / uninstall) and check the tag matches the build
        shell: pwsh
        run: ./scripts/smoke_test.ps1 -Dir dist -Version ("${{ github.ref_name }}".TrimStart("v"))
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClaudePet-Setup-*.exe
            dist/ClaudePet-*-windows-portable.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,mac]"
      - run: python scripts/build.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudePet-*-macos.zip
