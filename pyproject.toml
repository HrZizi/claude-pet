[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pet"
dynamic = ["version"]
description = "An animated pixel-art taskbar / Dock pet that shows what Claude Code is doing and how much usage you have left."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Philipp Zinniel" }]
keywords = ["claude", "claude-code", "taskbar", "desktop-pet", "tkinter", "pixel-art"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = []                       # standard library only (Tkinter)

[project.optional-dependencies]
mac = ["pyobjc-framework-Cocoa"]        # exact Dock position on macOS
dev = ["pytest", "pillow", "pyinstaller"]

[project.urls]
Homepage = "https://github.com/HrZizi/claude-pet"
Issues = "https://github.com/HrZizi/claude-pet/issues"

[project.scripts]
claude-pet-cli = "claude_pet.cli:main"

[project.gui-scripts]
claude-pet = "claude_pet.cli:main"

[tool.setuptools.dynamic]
version = { attr = "claude_pet.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_pet = ["packs/*/pack.json", "packs/*/*.png"]       # the built-in sprite packs

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
